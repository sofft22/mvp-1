<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<title>Dashboard · BioStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5;
  --bg-2:#F4EFE7;
  --ink:#0F0F0F;
  --ink-2:#2B2B2B;
  --muted:#6B6660;
  --faint:#9A948C;
  --line:#E6DFD4;
  --accent:#C66B4F;
  --accent-soft:#F5E4DB;
  --danger:#B14A2E;
  --green:#226E3C;
  --wa:#25D366;
  --cta:#1A1A1A;
  --cta-ink:#FBF9F5;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button{font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden],.hide{display:none!important}

.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar .wrap{
  display:flex;align-items:center;justify-content:space-between;
  height:60px;
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;
}
.logout{
  background:none;border:0;cursor:pointer;
  font:600 13.5px var(--sans);
  color:var(--muted);
  padding:8px 4px;
}
.logout:hover{color:var(--ink)}

/* ---------- Desktop nav ---------- */
.dnav{
  display:none;
  gap:2px;
  border-bottom:1px solid var(--line);
}
.dnav .wrap{display:flex;gap:2px;padding:0 20px}
.dnav-tab{
  background:none;border:0;cursor:pointer;
  font:600 14px var(--sans);
  color:var(--muted);
  padding:14px 16px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.dnav-tab:hover{color:var(--ink)}
.dnav-tab[aria-current="page"]{
  color:var(--ink);
  border-bottom-color:var(--ink);
  font-weight:700;
}

/* ---------- Page ---------- */
main{
  padding:24px 0 calc(120px + env(safe-area-inset-bottom,0px));
}
.page-title{
  font-size:24px;font-weight:800;
  letter-spacing:-.03em;line-height:1.15;
  margin:0 0 6px;
}
.page-sub{
  font-size:14px;color:var(--muted);
  margin:0 0 24px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:700 14px/1 var(--sans);
  background:var(--cta);color:var(--cta-ink);
  padding:13px 20px;border-radius:999px;
  border:0;cursor:pointer;
  transition:opacity .15s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.small{padding:10px 16px;font-size:13px}
.btn.wa{background:var(--wa);color:#073b1b}
.btn.block{width:100%}

/* ---------- Store card ---------- */
.store-card{
  padding:20px 0 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.store-label{
  font-size:10px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);
  margin-bottom:8px;
}
.store-name{
  font-size:20px;font-weight:800;letter-spacing:-.02em;
  line-height:1.2;margin:0 0 4px;
}
.store-url{
  font:500 13px ui-monospace,"SF Mono",Menlo,monospace;
  color:var(--muted);
  word-break:break-all;
  display:block;
  margin-bottom:16px;
}
.store-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Checklist ---------- */
.checklist{
  padding:0 0 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.checklist h2{
  font-size:15px;font-weight:800;
  letter-spacing:-.015em;
  margin:0 0 14px;
}
.checklist ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checklist li{
  display:flex;align-items:center;gap:12px;
  font-size:14.5px;font-weight:500;
}
.checklist .tick{
  flex-shrink:0;
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);
  display:grid;place-items:center;
  font-size:11px;font-weight:800;
  color:var(--faint);
}
.checklist li.done .tick{
  background:var(--ink);color:var(--cta-ink);border-color:var(--ink);
}
.checklist li.done .t{
  color:var(--faint);
  text-decoration:line-through;
  text-decoration-thickness:1.5px;
}
.checklist .go{
  margin-left:auto;
  background:none;border:0;cursor:pointer;
  font:700 12.5px var(--sans);
  color:var(--accent);
  padding:2px 6px;
}

/* ---------- Section head ---------- */
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.sec-head h2{
  font-size:18px;font-weight:800;
  letter-spacing:-.02em;
  margin:0;
}
.count{
  font:600 12.5px var(--sans);
  color:var(--muted);
  padding:4px 10px;
  border:1px solid var(--line);
  border-radius:999px;
}

/* ---------- Product list ---------- */
.plist{display:grid;gap:0}
.prod{
  display:grid;grid-template-columns:64px 1fr;
  gap:14px;align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.prod:first-child{border-top:1px solid var(--line)}
.prod .th{
  width:64px;height:64px;
  background:var(--bg-2);
  display:grid;place-items:center;
  font:800 20px var(--sans);
  overflow:hidden;
}
.prod .th img{width:100%;height:100%;object-fit:cover}
.prod .nm{
  font-size:15px;font-weight:700;
  letter-spacing:-.01em;
  line-height:1.3;
  margin-bottom:3px;
}
.prod .pr{
  font-size:13.5px;font-weight:600;
  color:var(--muted);
  margin-bottom:8px;
}
.prod .acts{display:flex;gap:14px}
.prod .acts button{
  background:none;border:0;cursor:pointer;
  font:600 12.5px var(--sans);
  color:var(--muted);
  padding:0;
}
.prod .acts button:hover{color:var(--ink)}
.prod .acts button.danger:hover{color:var(--danger)}

.pill{
  display:inline-block;
  font:700 10.5px var(--sans);
  letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  background:var(--bg-2);color:var(--muted);
  margin-left:6px;
}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.empty{
  padding:48px 16px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

/* ---------- Form section ---------- */
.form-section{margin-bottom:32px}
.form-section:last-of-type{margin-bottom:0}
.section-title{
  font-size:10.5px;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);
  margin:0 0 4px;
}
.section-desc{
  font-size:12.5px;
  color:var(--muted);
  margin:0 0 14px;
  line-height:1.5;
}

.field{
  padding:14px 0;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.field:first-of-type{border-top:1px solid var(--line)}
.field-label{
  font-size:12.5px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-.005em;
}
.field-hint{
  font-size:11.5px;
  color:var(--faint);
  margin-top:3px;
  font-weight:500;
}
.field input[type="text"],
.field input[type="tel"],
.field input[type="email"],
.field input[type="number"],
.field textarea,
.field select{
  width:100%;
  font:500 14.5px var(--sans);
  padding:11px 13px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  border-radius:10px;
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
  appearance:none;
}
.field textarea{min-height:76px;resize:vertical;line-height:1.5}
.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:var(--cta);
  box-shadow:0 0 0 3px rgba(26,26,26,.06);
}
.field input::placeholder,
.field textarea::placeholder{color:var(--faint)}

/* toggle */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:14px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.toggle-name{font-size:13.5px;font-weight:600;margin:0 0 3px}
.toggle-desc{font-size:12.5px;color:var(--muted);margin:0}

.switch{
  position:relative;
  width:44px;height:26px;
  background:rgba(26,26,26,.15);
  border:0;padding:0;cursor:pointer;
  border-radius:999px;
  flex-shrink:0;
  transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;background:#fff;
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .2s;
}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* images */
.imgs-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:12px;
}
.imgs-count{font:600 12px var(--sans);color:var(--faint)}
.imgs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.img-cell{
  position:relative;
  aspect-ratio:1;
  background:var(--bg-2);
  overflow:hidden;
}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block}
.img-cell .x{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;
  background:var(--bg);border:0;cursor:pointer;
  display:grid;place-items:center;
  border-radius:50%;
  color:var(--ink);
}
.img-cell .x svg{width:14px;height:14px}
.img-cell .x:hover{color:var(--accent)}
.img-cell .main-tag{
  position:absolute;bottom:6px;left:6px;
  font:700 9px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  background:var(--ink);color:var(--bg);
  padding:3px 7px;
}
.img-add{
  aspect-ratio:1;
  border:1.5px dashed var(--line);
  display:grid;place-items:center;
  gap:8px;
  cursor:pointer;
  font:700 10px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);
  text-align:center;
  padding:8px;
  transition:color .2s,border-color .2s;
}
.img-add:hover{color:var(--accent);border-color:var(--accent)}
.img-add svg{width:18px;height:18px;display:block;margin:0 auto}
.img-add input{display:none}

/* variants */
.vhead{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:12px;
}
.vadd{
  background:none;border:0;cursor:pointer;
  font:700 11px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
  padding:4px;
}
.vadd:hover{color:var(--accent)}
.vadd svg{width:13px;height:13px}

.vempty{
  padding:24px 16px;
  text-align:center;
  border:1.5px dashed var(--line);
  font-size:13px;
  color:var(--muted);
}
.vitem{
  padding:14px 0;
  border-top:1px solid var(--line);
}
.vitem:last-child{border-bottom:1px solid var(--line)}
.vgrid{display:grid;grid-template-columns:1fr;gap:12px}
.vlabel{
  font:700 11px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}
.vitem input{
  width:100%;
  font:500 14px var(--sans);
  padding:10px 12px;
  border:1.5px solid var(--line);
  background:var(--bg);
  border-radius:10px;
  outline:none;
}
.vitem input:focus{border-color:var(--cta)}
.vremove{
  margin-top:12px;
  background:none;border:0;cursor:pointer;
  font:700 11px var(--sans);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--danger);
  padding:0;
  text-decoration:underline;
  text-underline-offset:4px;
}

/* form actions */
.form-actions{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:32px;
  padding-top:24px;
  border-top:1px solid var(--line);
}
.del-btn{
  background:none;border:0;cursor:pointer;
  font:700 13px var(--sans);
  color:var(--danger);
  padding:12px 0;
  margin-right:auto;
  text-decoration:underline;
  text-underline-offset:4px;
}

.err{
  font-size:13.5px;
  font-weight:600;
  color:var(--danger);
  margin-top:16px;
}

/* back link */
.back{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;cursor:pointer;
  font:600 13px var(--sans);
  color:var(--muted);
  padding:0;
  margin-bottom:20px;
}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}

/* ---------- Plan ---------- */
.plan-current{
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.plan-label{
  font-size:10px;font-weight:800;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);
  margin-bottom:8px;
}
.plan-name{
  font-size:26px;font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  margin:0;
}
.plan-meta{font-size:13px;color:var(--muted);margin-top:8px}

.plan-row{
  padding:16px 0;
  border-bottom:1px solid var(--line);
}
.plan-row:last-of-type{border-bottom:0}
.plan-row h3{
  font-size:15px;font-weight:800;
  letter-spacing:-.015em;
  margin:0 0 4px;
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;
}
.plan-row .price{
  font-size:13.5px;font-weight:700;
  margin-bottom:6px;
}
.plan-row .price small{font-weight:500;color:var(--muted);font-size:12.5px}
.plan-row ul{
  list-style:none;padding:0;margin:0;
  color:var(--muted);font-size:13px;
  display:grid;gap:2px;
}
.plan-row.current{
  background:var(--accent-soft);
  margin:0 -20px;
  padding:16px 20px;
}

.bankbox{
  background:var(--bg-2);
  padding:14px 16px;
  margin-bottom:14px;
  font-size:13px;
  border-radius:10px;
}
.bankbox div{
  display:flex;justify-content:space-between;gap:12px;
  padding:4px 0;
}
.bankbox span{color:var(--muted)}
.bankbox b{font-weight:700}

/* ---------- Bottom nav (mobile) ---------- */
.bnav{
  position:fixed;
  left:0;right:0;bottom:0;z-index:40;
  background:var(--bg);
  border-top:1px solid var(--line);
  padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.bnav-item{
  background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  padding:6px 4px;
  color:var(--muted);
  font:600 10.5px var(--sans);
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.bnav-item svg{
  width:22px;height:22px;
  stroke-width:1.75;
  fill:none;
  stroke:currentColor;
}
.bnav-item[aria-current="page"]{
  color:var(--ink);
}
.bnav-item[aria-current="page"] svg{stroke-width:2.2}

/* ---------- Toast ---------- */
#toast{
  position:fixed;
  left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,140%);
  background:var(--ink);color:var(--cta-ink);
  font:600 13.5px var(--sans);
  padding:12px 20px;border-radius:999px;
  box-shadow:0 10px 30px -10px rgba(15,15,15,.5);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  z-index:100;
  max-width:calc(100% - 40px);
  text-align:center;
}
#toast.show{transform:translate(-50%,0)}

/* ---------- Desktop ---------- */
@media (min-width:720px){
  .wrap{padding:0 32px}
  .dnav{display:block}
  main{padding:32px 0 80px}
  .topbar .wrap{height:68px}
  .logo{font-size:16px}
  .bnav{display:none}
  #toast{bottom:32px}
  .page-title{font-size:28px}
  .field{
    grid-template-columns:220px 1fr;
    gap:24px;
    align-items:center;
    padding:16px 0;
  }
  .field.stack{align-items:flex-start}
  .field.stack .field-label{padding-top:10px}
  .imgs{grid-template-columns:repeat(3,120px)}
  .vgrid{grid-template-columns:1fr 160px}
  .prod{grid-template-columns:76px 1fr;padding:16px 0}
  .prod .th{width:76px;height:76px}
}
</style>
<script src="/config.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#/products">BioStore</a>
    <button class="logout" id="logout" type="button">Log out</button>
  </div>
  <nav class="dnav">
    <div class="wrap">
      <button class="dnav-tab" data-route="products" type="button">Products</button>
      <button class="dnav-tab" data-route="settings" type="button">Settings</button>
      <button class="dnav-tab" data-route="plan" type="button">Plan</button>
    </div>
  </nav>
</header>

<main>
  <div class="wrap" id="app">
    <p style="color:var(--muted)">Loading your store…</p>
  </div>
</main>

<nav class="bnav" id="bnav">
  <button class="bnav-item" data-route="products" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
    <span>Products</span>
  </button>
  <button class="bnav-item" data-route="settings" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
  <button class="bnav-item" data-route="plan" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
    <span>Plan</span>
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   State
============================================================ */
var S = { me: null, route: "products", editing: null };
var P = { id: null, images: [], variants: [], inStock: true };
var $ = function (id) { return document.getElementById(id); };
var CFG = window.BIOSHOP_CONFIG || {};

/* ============================================================
   Utils
============================================================ */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function naira(n) { return "₦" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2400); }
function dateStr(ms) { return new Date(ms).toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" }); }

async function api(method, url, body, rawType) {
  var opt = { method: method, headers: {}, credentials: "same-origin" };
  if (body !== undefined) {
    if (rawType) { opt.headers["content-type"] = rawType; opt.body = body; }
    else { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
  }
  var r = await fetch(url, opt), d = null;
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = "/login"; throw new Error("Please log in again."); }
  if (!r.ok) throw new Error((d && d.error) || "Something went wrong.");
  return d;
}

function storeUrl() { return location.origin + "/store/" + S.me.store.slug; }

/* ============================================================
   Routing (hash-based)
============================================================ */
function parseRoute() {
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  if (parts[0] === "product") return { name: "product", id: parts[1] || null };
  if (parts[0] === "settings") return { name: "settings" };
  if (parts[0] === "plan") return { name: "plan" };
  return { name: "products" };
}
function navigate(path) { location.hash = path; }

window.addEventListener("hashchange", function () {
  var r = parseRoute();
  if (r.name === "product") { openForm(r.id); }
  else {
    S.route = r.name;
    S.editing = null;
    render();
  }
  updateNavActive();
});

function updateNavActive() {
  var route = S.editing ? "products" : S.route;
  document.querySelectorAll("[data-route]").forEach(function (b) {
    var target = b.getAttribute("data-route");
    var active = (target === route);
    if (b.classList.contains("bnav-item")) {
      if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    } else {
      if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    }
  });
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-route]");
  if (!b) return;
  var route = b.getAttribute("data-route");
  navigate("/" + route);
});

/* ============================================================
   Data load
============================================================ */
async function load() {
  S.me = await api("GET", "/api/me");
  var r = parseRoute();
  if (r.name === "product") { openForm(r.id); }
  else { S.route = r.name; S.editing = null; render(); }
  updateNavActive();
}

/* ============================================================
   Render dispatcher
============================================================ */
function render() {
  var html = "";
  if (S.editing !== null) html = formView();
  else if (S.route === "products") html = productsView();
  else if (S.route === "settings") html = settingsView();
  else if (S.route === "plan") html = planView();
  $("app").innerHTML = html;

  if (S.editing !== null) wireForm();
  if (S.route === "settings") wireSettings();
}

function openForm(id) {
  if (id) {
    var p = S.me.products.find(function (x) { return x.id === id; });
    if (!p) { navigate("/products"); return; }
    P = {
      id: p.id,
      name: p.name || "",
      description: p.description || "",
      price: p.price || "",
      compare: p.compareAtPrice || p.compare_at_price || "",
      category: p.category || p.category_id || "clothing",
      badge: p.badge || "",
      inStock: !(p.inStock === false || p.in_stock === false),
      images: (p.images || []).map(function (i) { return i.url || i; }),
      variants: (p.variants && p.variants.suggested) || []
    };
  } else {
    P = { id: null, images: [], variants: [], inStock: true, name: "", description: "", price: "", compare: "", category: "clothing", badge: "" };
  }
  S.editing = id || "new";
  render();
  updateNavActive();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function wireForm() {
  var name = $("pname"); if (name) name.addEventListener("input", function(){ P.name = name.value; });
  var desc = $("pdesc"); if (desc) desc.addEventListener("input", function(){ P.description = desc.value; });
  var price = $("pprice"); if (price) price.addEventListener("input", function(){ P.price = price.value; });
  var compare = $("pcompare"); if (compare) compare.addEventListener("input", function(){ P.compare = compare.value; });
  var cat = $("pcat"); if (cat) cat.addEventListener("change", function(){ P.category = cat.value; });
  var badge = $("pbadge"); if (badge) badge.addEventListener("change", function(){ P.badge = badge.value; });
  var stock = $("pstock");
  if (stock) stock.addEventListener("click", function(){
    P.inStock = !P.inStock;
    stock.setAttribute("aria-checked", P.inStock ? "true" : "false");
    var d = $("stockDesc"); if (d) d.textContent = P.inStock ? "Available for purchase" : "Hidden from sale";
  });
  renderImages();
  renderVariants();
  var vadd = $("vadd");
  if (vadd) vadd.addEventListener("click", function(){ P.variants.push({ label: "", priceDelta: 0 }); renderVariants(); });
  var del = $("pdel");
  if (del) del.addEventListener("click", async function(){
    if (!confirm("Delete this product? This can't be undone.")) return;
    try { await api("DELETE", "/api/products/" + P.id); navigate("/products"); await load(); toast("Product deleted"); }
    catch (x) { alert(x.message); }
  });
  var form = $("pform");
  if (form) form.addEventListener("submit", saveProduct);
  var imgs = $("images");
  if (imgs) imgs.addEventListener("click", function (e) {
    var rm = e.target.closest("[data-rm]");
    if (rm) { P.images.splice(Number(rm.getAttribute("data-rm")), 1); renderImages(); }
  });
  var vars = $("variants");
  if (vars) {
    vars.addEventListener("click", function (e) {
      var vrm = e.target.closest("[data-vrm]");
      if (vrm) { P.variants.splice(Number(vrm.getAttribute("data-vrm")), 1); renderVariants(); }
    });
    vars.addEventListener("input", function (e) {
      var vi = e.target.getAttribute("data-vi");
      if (vi == null) return;
      var i = Number(vi), k = e.target.getAttribute("data-vk");
      P.variants[i][k] = (k === "priceDelta") ? Number(e.target.value) : e.target.value;
    });
  }
}

function renderImages() {
  var lim = S.me.limits.images;
  var h = "";
  P.images.forEach(function (url, i) {
    h += '<div class="img-cell">' +
      '<img src="' + esc(url) + '" alt="">' +
      '<button type="button" class="x" data-rm="' + i + '" aria-label="Remove">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
      (i === 0 ? '<span class="main-tag">Main</span>' : "") +
    '</div>';
  });
  if (P.images.length < lim) {
    h += '<label class="img-add">' +
      '<input type="file" accept="image/*" id="imgInput">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
      '<span>Add</span>' +
    '</label>';
  }
  $("images").innerHTML = h;
  $("imgCount").textContent = P.images.length + " / " + lim;
  var inp = $("imgInput");
  if (inp) inp.addEventListener("change", onImg);
}

async function onImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  var lbl = e.target.closest(".img-add");
  if (lbl) { lbl.style.pointerEvents = "none"; lbl.style.opacity = ".5"; }
  try {
    var blob = await compress(file);
    var r = await fetch("/api/upload", {
      method: "POST",
      headers: { "content-type": "image/jpeg" },
      body: blob,
      credentials: "same-origin"
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || "Upload failed");
    P.images.push(d.url);
    renderImages();
  } catch (x) { alert(x.message); }
  if (lbl) { lbl.style.pointerEvents = ""; lbl.style.opacity = ""; }
}

async function compress(file) {
  var bmp = await createImageBitmap(file);
  var scale = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  var c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.85); });
}

function renderVariants() {
  if (!P.variants.length) {
    $("variants").innerHTML = '<div class="vempty">No variants — single price.</div>';
    return;
  }
  $("variants").innerHTML = P.variants.map(function (v, i) {
    return '<div class="vitem">' +
      '<div class="vgrid">' +
        '<div><label class="vlabel">Label</label><input type="text" data-vi="' + i + '" data-vk="label" value="' + esc(v.label || "") + '" placeholder="e.g. Size M"></div>' +
        '<div><label class="vlabel">+ Price (₦)</label><input type="number" data-vi="' + i + '" data-vk="priceDelta" value="' + esc(v.priceDelta || 0) + '" placeholder="0"></div>' +
      '</div>' +
      '<button type="button" class="vremove" data-vrm="' + i + '">Remove</button>' +
    '</div>';
  }).join("");
}

async function saveProduct(e) {
  e.preventDefault();
  var err = $("perr"), btn = $("psave");
  err.classList.add("hide");
  var name = (P.name || "").trim();
  var price = Number(P.price);
  if (name.length < 2) return showFormErr("Enter the product name.");
  if (!price || price < 1) return showFormErr("Enter a valid price.");
  if (!P.images.length) return showFormErr("Add at least one image.");

  btn.disabled = true;
  var oldText = btn.textContent;
  btn.textContent = "Saving…";
  try {
    var body = {
      name: name,
      price: price,
      description: P.description || "",
      compareAtPrice: P.compare ? Number(P.compare) : null,
      category: P.category || "clothing",
      badge: P.badge || null,
      inStock: P.inStock,
      images: P.images,
      variants: P.variants.length ? { suggested: P.variants } : null
    };
    if (P.id) await api("PUT", "/api/products/" + P.id, body);
    else await api("POST", "/api/products", body);
    navigate("/products");
    await load();
    toast(P.id ? "Product saved" : "Product created");
  } catch (x) {
    showFormErr(x.message);
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

function showFormErr(msg) {
  var err = $("perr");
  err.textContent = msg;
  err.classList.remove("hide");
  err.scrollIntoView({ behavior: "smooth", block: "center" });
}

    '<div class="plan-label">Your plan</div>' +
    '<div class="plan-name">' + esc(m.limits.planName) + '</div>';
  if (u.plan !== "free" && u.planExpiresAt) {
    h += u.planExpiresAt > now
      ? '<p class="plan-meta">Active until ' + dateStr(u.planExpiresAt) + '.</p>'
      : '<p class="plan-meta">Ended ' + dateStr(u.planExpiresAt) + '. Renew to show all products again.</p>';
  }
  h += '</div>';

  h += '<h3 class="section-title" style="margin-bottom:14px">Available plans</h3>';
  ["free", "starter", "pro"].forEach(function (k) {
    var p = plans[k];
    var isCurrent = m.limits.planName === p.name;
    h += '<div class="plan-row' + (isCurrent ? " current" : "") + '">' +
      '<h3>' + p.name + (isCurrent ? ' <span class="pill accent">Current</span>' : "") + '</h3>' +
      '<div class="price">' + (p.price ? naira(p.price) + ' <small>per month</small>' : '<small>Free forever</small>') + '</div>' +
      '<ul>' +
        '<li>' + limitText(p.products) + ' products</li>' +
        '<li>' + p.images + ' image' + (p.images > 1 ? "s" : "") + ' per product</li>' +
      '</ul>' +
    '</div>';
  });

  h += '<div style="margin-top:32px">' +
    '<h3 class="section-title">How to upgrade</h3>' +
    '<p class="section-desc">' + (CFG.accountNumber
      ? "Send the plan price to the account below, then message us on WhatsApp."
      : "Message BioStore on WhatsApp to upgrade.") + '</p>';

  if (CFG.accountNumber) {
    h += '<div class="bankbox">' +
      bankRow("Bank", CFG.bankName) +
      bankRow("Account name", CFG.accountName) +
      bankRow("Account number", CFG.accountNumber) +
    '</div>';
  }
  if (CFG.whatsapp) {
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">';
    ["starter", "pro"].forEach(function (k) {
      var text = "Hi BioStore, I'd like the " + plans[k].name + " plan. My email is " + u.email + ".";
      h += '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(CFG.whatsapp) + "?text=" + encodeURIComponent(text) + '">Ask about ' + plans[k].name + '</a>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function limitText(n) { return n >= 100000 ? "Unlimited" : String(n); }
function bankRow(k, v) { return v ? "<div><span>" + esc(k) + "</span><b>" + esc(v) + "</b></div>" : ""; }

/* ============================================================
   Copy link
============================================================ */
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act='copylink']");
  if (b) copy(storeUrl());
  var add = e.target.closest("[data-act='add']");
  if (add) navigate("/product");
  var edit = e.target.closest("[data-act='edit']");
  if (edit) navigate("/product/" + edit.getAttribute("data-id"));
  var close = e.target.closest("[data-act='close-form']");
  if (close) navigate("/products");
  var del = e.target.closest("[data-act='del']");
  if (del) {
    var p = S.me.products.find(function (x) { return x.id === del.getAttribute("data-id"); });
    if (p && confirm("Delete " + p.name + "? This can't be undone.")) {
      api("DELETE", "/api/products/" + p.id).then(function () { return load(); }).then(function () { toast("Product deleted"); });
    }
  }
});

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast("Link copied"); }, fb);
  } else fb();
  function fb() {
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); toast("Link copied"); } catch (e) {}
    document.body.removeChild(t);
  }
}

/* ============================================================
   Logout
============================================================ */
$("logout").addEventListener("click", async function () {
  try { await api("POST", "/api/logout", {}); } catch (e) {}
  location.href = "/";
});

/* ============================================================
   Boot
============================================================ */
load().catch(function (x) {
  $("app").innerHTML = '<p style="color:var(--danger)">' + esc(x.message) + "</p>";
});
</script>
