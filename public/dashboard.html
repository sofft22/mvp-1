<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard · BioStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5;
  --bg-2:#F4EFE7;
  --ink:#0F0F0F;
  --ink-2:#2B2B2B;
  --muted:#6B6660;
  --faint:#9A948C;
  --line:#E6DFD4;
  --accent:#C66B4F;
  --accent-soft:#F5E4DB;
  --danger:#B14A2E;
  --green:#226E3C;
  --wa:#25D366;
  --cta:#1A1A1A;
  --cta-ink:#FBF9F5;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button{font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden],.hide{display:none!important}

.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
header.top{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
header.top .wrap{
  display:flex;align-items:center;justify-content:space-between;
  height:60px;
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);
}
.top-actions{display:flex;align-items:center;gap:8px}
.link{
  background:none;border:0;cursor:pointer;
  font:600 14px var(--sans);
  color:var(--muted);
  padding:8px 12px;border-radius:8px;
  transition:color .15s,background .15s;
}
.link:hover{color:var(--ink);background:var(--bg-2)}

/* ---------- Page ---------- */
main{padding:24px 0 100px}

/* ---------- Greeting ---------- */
.greeting{margin-bottom:24px}
.greeting .hello{
  font-size:13.5px;font-weight:600;
  color:var(--muted);
  margin:0 0 4px;
}
.greeting h1{
  font-size:26px;font-weight:800;
  letter-spacing:-.03em;line-height:1.15;
  margin:0;
}
.greeting h1 .name{color:var(--accent)}
.greeting .sub{
  margin-top:8px;
  font-size:14px;
  color:var(--muted);
}

/* ---------- Main nav ---------- */
.nav{
  display:flex;gap:4px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav-tab{
  background:none;border:0;cursor:pointer;
  font:600 14px var(--sans);
  color:var(--muted);
  padding:12px 14px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.nav-tab:hover{color:var(--ink)}
.nav-tab[aria-selected="true"]{
  color:var(--ink);
  border-bottom-color:var(--ink);
  font-weight:700;
}

/* ---------- Sub tabs ---------- */
.subtabs{
  display:flex;gap:4px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
  overflow-x:auto;
  scrollbar-width:none;
}
.subtabs::-webkit-scrollbar{display:none}
.sub-tab{
  background:none;border:0;cursor:pointer;
  font:600 13px var(--sans);
  color:var(--muted);
  padding:10px 12px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.sub-tab:hover{color:var(--ink)}
.sub-tab[aria-selected="true"]{
  color:var(--accent);
  border-bottom-color:var(--accent);
  font-weight:700;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:700 14px/1 var(--sans);
  background:var(--cta);color:var(--cta-ink);
  padding:12px 18px;border-radius:999px;
  border:0;cursor:pointer;
  transition:opacity .15s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.small{padding:10px 16px;font-size:13px}
.btn.wa{background:var(--wa);color:#073b1b}

/* ---------- Store info ---------- */
.store-info{
  padding:20px 0 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.store-copy{min-width:0;flex:1}
.store-label{
  font-size:10px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);
  margin-bottom:8px;
}
.store-name{
  font-size:22px;font-weight:800;letter-spacing:-.02em;
  line-height:1.2;margin:0 0 6px;
}
.store-link{
  font:500 13px ui-monospace,"SF Mono",Menlo,monospace;
  color:var(--muted);
  word-break:break-all;
}
.store-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}

/* ---------- Checklist ---------- */
.checklist{
  padding:0 0 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.checklist h2{
  font-size:15px;font-weight:800;
  letter-spacing:-.015em;
  margin:0 0 14px;
}
.checklist ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checklist li{
  display:flex;align-items:center;gap:12px;
  font-size:14.5px;font-weight:500;
  color:var(--ink-2);
}
.checklist .tick{
  flex-shrink:0;
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);
  display:grid;place-items:center;
  font-size:11px;font-weight:800;
  color:var(--faint);
}
.checklist li.done .tick{
  background:var(--ink);color:var(--cta-ink);border-color:var(--ink);
}
.checklist li.done .t{
  color:var(--faint);
  text-decoration:line-through;
  text-decoration-thickness:1.5px;
}
.checklist .link{
  font-size:13px;font-weight:700;
  padding:2px 6px;color:var(--accent);
}

/* ---------- Product list ---------- */
.list-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.list-head h2{
  font-size:19px;font-weight:800;
  letter-spacing:-.025em;
  margin:0;
}
.count{
  font:600 13px var(--sans);
  color:var(--muted);
  padding:4px 10px;
  border:1px solid var(--line);
  border-radius:999px;
}
.plist{display:grid;gap:0}
.prod{
  display:grid;grid-template-columns:64px 1fr;
  gap:16px;align-items:center;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}
.prod:first-child{border-top:1px solid var(--line)}
.prod .th{
  width:64px;height:64px;
  background:var(--bg-2);
  display:grid;place-items:center;
  font:800 20px var(--sans);
  overflow:hidden;
  flex-shrink:0;
}
.prod .th img{width:100%;height:100%;object-fit:cover}
.prod .nm{
  font-size:15px;font-weight:700;
  letter-spacing:-.01em;
  line-height:1.3;
  margin-bottom:3px;
}
.prod .pr{
  font-size:13.5px;font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
}
.prod .acts{display:flex;gap:14px}
.prod .acts button{
  background:none;border:0;cursor:pointer;
  font:600 12.5px var(--sans);
  color:var(--muted);
  padding:0;
  transition:color .15s;
}
.prod .acts button:hover{color:var(--ink)}
.prod .acts button.danger:hover{color:var(--danger)}

.pill{
  display:inline-block;
  font:700 10.5px var(--sans);
  letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  background:var(--bg-2);color:var(--muted);
  margin-left:6px;
}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.empty-list{
  padding:40px 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

/* ---------- Form (settings + product) ---------- */
.form-section{margin-bottom:28px}
.form-section:last-child{margin-bottom:0}

.section-title{
  font-size:11px;font-weight:800;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);
  margin:0 0 12px;
}

.section-desc{
  font-size:12.5px;color:var(--muted);
  margin:0 0 16px;
  line-height:1.5;
}

.panel{
  border-top:1px solid var(--line);
}

.row{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  padding:18px 0;
  border-bottom:1px solid var(--line);
  align-items:center;
}
.row-label{
  font-size:12.5px;font-weight:700;
  letter-spacing:-.005em;
  color:var(--ink);
}
.row-hint{
  font-size:12px;
  color:var(--faint);
  margin-top:4px;
  line-height:1.4;
  font-weight:500;
}

.row input[type="text"],
.row input[type="tel"],
.row input[type="email"],
.row input[type="number"],
.row input[type="password"],
.row textarea,
.row select{
  width:100%;
  font:500 14.5px var(--sans);
  padding:11px 13px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  border-radius:10px;
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
  appearance:none;
}
.row textarea{min-height:80px;resize:vertical;line-height:1.5}
.row input:focus,
.row textarea:focus,
.row select:focus{
  outline:none;
  border-color:var(--cta);
  box-shadow:0 0 0 3px rgba(26,26,26,.06);
}
.row input::placeholder,
.row textarea::placeholder{color:var(--faint)}

/* Toggle row */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:18px 0;
  border-bottom:1px solid var(--line);
}
.toggle-copy{min-width:0}
.toggle-name{font-size:13.5px;font-weight:600;margin:0 0 3px}
.toggle-desc{font-size:12.5px;color:var(--muted);margin:0}

.switch{
  position:relative;
  width:44px;height:26px;
  background:rgba(26,26,26,.15);
  border:0;padding:0;cursor:pointer;
  border-radius:999px;
  flex-shrink:0;
  transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;background:#fff;
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .2s;
}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- Images ---------- */
.images-head{
  display:flex;justify-content:space-between;
  align-items:baseline;
  margin-bottom:14px;
  gap:12px;
}
.images-count{
  font:600 12px var(--sans);
  color:var(--faint);
}
.images{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.img-cell{
  position:relative;
  aspect-ratio:1;
  background:var(--bg-2);
  overflow:hidden;
}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block}
.img-cell .x{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;
  background:var(--bg);border:0;cursor:pointer;
  display:grid;place-items:center;
  border-radius:50%;
  color:var(--ink);
  transition:color .15s;
}
.img-cell .x:hover{color:var(--accent)}
.img-cell .x svg{width:14px;height:14px}
.img-cell .main-tag{
  position:absolute;bottom:6px;left:6px;
  font:700 9px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  background:var(--ink);color:var(--bg);
  padding:3px 7px;
}
.img-add{
  aspect-ratio:1;
  border:1.5px dashed var(--line);
  background:var(--bg);
  display:grid;place-items:center;
  gap:8px;
  cursor:pointer;
  font:700 10px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);
  transition:color .2s,border-color .2s;
  text-align:center;
  padding:8px;
  border-radius:0;
}
.img-add:hover{color:var(--accent);border-color:var(--accent)}
.img-add svg{width:18px;height:18px;display:block;margin:0 auto}
.img-add input{display:none}
.img-add.uploading{pointer-events:none;opacity:.6}

/* ---------- Variants ---------- */
.vhead{
  display:flex;justify-content:space-between;
  align-items:baseline;
  margin-bottom:14px;
  gap:12px;
}
.vadd{
  background:none;border:0;cursor:pointer;
  font:700 11px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
  padding:4px;
  transition:color .15s;
}
.vadd:hover{color:var(--accent)}
.vadd svg{width:13px;height:13px}

.vempty{
  padding:28px 16px;
  text-align:center;
  border:1.5px dashed var(--line);
  font-size:13px;
  color:var(--muted);
}

.vitem{
  border-top:1px solid var(--line);
  padding:16px 0;
}
.vitem:last-child{border-bottom:1px solid var(--line)}
.vgrid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.vlabel{
  font:700 11px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}
.vitem input{
  width:100%;
  font:500 14px var(--sans);
  padding:10px 12px;
  border:1.5px solid var(--line);
  background:var(--bg);
  border-radius:10px;
  outline:none;
  transition:border-color .15s;
}
.vitem input:focus{border-color:var(--cta)}
.vremove{
  margin-top:12px;
  background:none;border:0;cursor:pointer;
  font:700 11px var(--sans);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--danger);
  padding:0;
  text-decoration:underline;
  text-underline-offset:4px;
}

/* ---------- Actions row ---------- */
.form-actions{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  padding-top:8px;
  margin-top:24px;
  border-top:1px solid var(--line);
  padding-top:24px;
}
.form-actions .del{
  background:none;color:var(--danger);
  padding:12px 4px;
  margin-right:auto;
  font:700 13px var(--sans);
  letter-spacing:-.005em;
  text-decoration:underline;
  text-underline-offset:4px;
  border:0;cursor:pointer;
}
.form-actions .del:hover{opacity:.8}

/* ---------- Plan ---------- */
.plan-current{
  padding:0 0 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.plan-label{
  font-size:10px;font-weight:800;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);
  margin-bottom:8px;
}
.plan-name{
  font-size:28px;font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  margin:0;
}
.plan-meta{
  font-size:13px;color:var(--muted);
  margin-top:8px;
}
.plan-row{
  padding:18px 0;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:start;
}
.plan-row:last-of-type{border-bottom:0}
.plan-row h3{
  font-size:15px;font-weight:800;
  letter-spacing:-.015em;
  margin:0 0 4px;
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;
}
.plan-row .price{
  font-size:13.5px;font-weight:700;
  color:var(--ink);
  margin-bottom:6px;
}
.plan-row .price small{font-weight:500;color:var(--muted);font-size:12.5px}
.plan-row ul{
  list-style:none;padding:0;margin:0;
  color:var(--muted);font-size:13px;
  display:grid;gap:2px;
}
.plan-row .btn{align-self:start}
.plan-row.current{
  background:var(--accent-soft);
  margin:0 -20px;
  padding:18px 20px;
  border-radius:0;
}

/* ---------- Bank box ---------- */
.bankbox{
  background:var(--bg-2);
  padding:14px 16px;
  margin-bottom:14px;
  font-size:13px;
  border-radius:10px;
}
.bankbox div{
  display:flex;justify-content:space-between;gap:12px;
  padding:4px 0;
}
.bankbox span{color:var(--muted)}
.bankbox b{font-weight:700;color:var(--ink)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;
  left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,140%);
  background:var(--ink);color:var(--cta-ink);
  font:600 14px var(--sans);
  padding:12px 20px;border-radius:999px;
  box-shadow:0 10px 30px -10px rgba(15,15,15,.5);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  z-index:100;
  max-width:calc(100% - 40px);
  text-align:center;
}
#toast.show{transform:translate(-50%,0)}

/* ---------- Desktop ---------- */
@media (min-width:640px){
  .wrap{padding:0 32px}
  main{padding:32px 0 100px}
  header.top .wrap{height:68px}
  .logo{font-size:16px}
  .greeting h1{font-size:30px}
  .store-name{font-size:26px}
  .prod{grid-template-columns:76px 1fr;padding:18px 0}
  .prod .th{width:76px;height:76px}
  .row{
    grid-template-columns:220px 1fr;
    gap:24px;
    padding:16px 0;
  }
  .row .input-stack{min-width:0}
  .vgrid{grid-template-columns:1fr 160px}
  .images{grid-template-columns:repeat(3, 120px);max-width:400px}
}
</style>
<script src="/config.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="/">BioStore</a>
    <div class="top-actions">
      <button class="link" id="logout" type="button">Log out</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"><p style="color:var(--muted)">Loading your store…</p></main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
var S = { me: null, tab: "products", formTab: "basics", editing: null };
var P = { id: null, images: [], files: [], variants: [], inStock: true };
var $ = function (id) { return document.getElementById(id); };
var CFG = window.BIOSHOP_CONFIG || {};

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function naira(n) { return "₦" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2600); }
function dateStr(ms) { return new Date(ms).toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" }); }
function greet() {
  var h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

async function api(method, url, body, rawType) {
  var opt = { method: method, headers: {}, credentials: "same-origin" };
  if (body !== undefined) {
    if (rawType) { opt.headers["content-type"] = rawType; opt.body = body; }
    else { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
  }
  var r = await fetch(url, opt), d = null;
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = "/login"; throw new Error("Please log in again."); }
  if (!r.ok) throw new Error((d && d.error) || "Something went wrong.");
  return d;
}

async function load() { S.me = await api("GET", "/api/me"); render(); }
function storeUrl() { return location.origin + "/store/" + S.me.store.slug; }

/* ============================================================
   RENDER
============================================================ */
function render() {
  var m = S.me, st = m.store;
  var named = st.name && st.name !== "My store";
  var contact = !!(st.whatsapp && st.accountNumber);
  var hasProduct = m.products.length > 0;
  var allDone = named && contact && hasProduct;

  // Greeting name: use store owner's first name, or store name
  var who = (st.ownerName && st.ownerName.split(" ")[0]) || st.name || "there";

  var html = '';

  // Greeting
  html += '<div class="greeting">' +

  html += '<nav class="nav" role="tablist">' +

  $("app").innerHTML = html;

}

function wireForm() {
  // Preserve values across tab switches
  var name = $("pname"); if (name) name.addEventListener("input", function(){ P.name = name.value; });

  var cat = $("pcat"); if (cat) cat.addEventListener("change", function(){ P.category = cat.value; });
  var badge = $("pbadge"); if (badge) badge.addEventListener("change", function(){ P.badge = badge.value; });
  var stock = $("pstock");
  if (stock) stock.addEventListener("click", function(){
    P.inStock = !P.inStock;
    stock.setAttribute("aria-checked", P.inStock ? "true" : "false");

function renderImages() {
  var lim = S.me.limits.images;

    '</div>';
  }).join("");

  var add = canAdd
    ? '<label class="img-add"><input type="file" accept="image/*" id="imgInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></label>'
    : "";

async function onImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  var lbl = e.target.closest(".img-add");
  if (lbl) lbl.classList.add("uploading");
  try {
    var blob = await compress(file);
    var r = await fetch("/api/upload", { method:"POST", headers:{ "content-type":"image/jpeg" }, body:blob, credentials:"same-origin" });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || "Upload failed");
    P.images.push(d.url);
    renderImages();
  } catch (x) { alert(x.message); }
  if (lbl) lbl.classList.remove("uploading");
}

async function compress(file) {
  var bmp = await createImageBitmap(file);
  var scale = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  var c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.85); });
}

      '</div>' +
      '<button type="button" class="vremove" data-vrm="' + i + '">Remove</button>' +
    '</div>';
  }).join("");

async function saveProduct(e) {
  e.preventDefault();
  var err = $("perr"), btn = $("psave");
  err.classList.add("hide");
  var name = (P.name || "").trim();
  var price = Number(P.price);
  if (name.length < 2) return showFormErr("Enter the product name.");
  if (!price || price < 1) return showFormErr("Enter a valid price.");
  if (!P.images.length) return showFormErr("Add at least one image.");

  btn.disabled = true; btn.textContent = "Saving…";
  try {
    var body = {
      name: name,
      price: price,
      description: P.description || "",
      compareAtPrice: P.compare ? Number(P.compare) : null,
      category: P.category || "clothing",
      badge: P.badge || null,
      inStock: P.inStock,
      images: P.images,
      variants: P.variants.length ? { suggested: P.variants } : null
    };
    if (P.id) await api("PUT", "/api/products/" + P.id, body);
    else await api("POST", "/api/products", body);
    closeForm();
    await load();
    toast(P.id ? "Product saved" : "Product created");
  } catch (x) { showFormErr(x.message); }
  btn.disabled = false; btn.textContent = P.id ? "Save changes" : "Create product";
}
function showFormErr(msg) {
  var err = $("perr");
  err.textContent = msg;
  err.classList.remove("hide");

function openForm(id) {
  if (id) {
    var p = S.me.products.find(function (x) { return x.id === id; });
    if (!p) return;
    P.id = p.id;
    P.name = p.name || "";
    P.description = p.description || "";
    P.price = p.price || "";
    P.compare = p.compareAtPrice || p.compare_at_price || "";
    P.category = p.category || p.category_id || "clothing";
    P.badge = p.badge || "";
    P.inStock = !(p.inStock === false || p.in_stock === false);
    P.images = (p.images || []).map(function (i) { return i.url || i; });
    P.variants = (p.variants && p.variants.suggested) || [];
  } else {
    P = { id: null, images: [], files: [], variants: [], inStock: true, name: "", description: "", price: "", compare: "", category: "clothing", badge: "" };
  }
  S.editing = id || "new";
  S.formTab = "basics";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeForm() {
  S.editing = null;
  S.formTab = "basics";
  P = { id: null, images: [], files: [], variants: [], inStock: true };
}

document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act");
  if (act === "tab") { S.tab = b.getAttribute("data-tab"); S.editing = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act === "form-tab") { S.formTab = b.getAttribute("data-tab"); render(); }
  else if (act === "go") {
    var g = b.getAttribute("data-go");
    if (g === "add") { S.tab = "products"; render(); openForm(null); }
    else { S.tab = g; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  }
  else if (act === "copylink") copy(storeUrl());
  else if (act === "add") openForm(null);
  else if (act === "edit") openForm(b.getAttribute("data-id"));
  else if (act === "close-form") { closeForm(); render(); }
  else if (act === "del") {
    var p = S.me.products.find(function (x) { return x.id === b.getAttribute("data-id"); });
    if (p && confirm("Delete " + p.name + "? This can't be undone.")) {
      try { await api("DELETE", "/api/products/" + p.id); await load(); toast("Product deleted"); }
      catch (x) { toast(x.message); }
    }
  }
});

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Link copied"); }, fb);
  else fb();
  function fb() { var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("Link copied"); } catch (e) {} document.body.removeChild(t); }
}

document.addEventListener("input", function (e) {
  if (e.target.id === "sslug") {
    var v = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
    e.target.value = v;
  }
  var vi = e.target.getAttribute("data-vi");
  if (vi != null) {
    var i = Number(vi), k = e.target.getAttribute("data-vk");
    P.variants[i][k] = (k === "priceDelta") ? Number(e.target.value) : e.target.value;
  }
});

document.addEventListener("click", function (e) {
  var rm = e.target.closest("[data-rm]");
  if (rm) { P.images.splice(Number(rm.getAttribute("data-rm")), 1); renderImages(); return; }
  var vrm = e.target.closest("[data-vrm]");
  if (vrm) { P.variants.splice(Number(vrm.getAttribute("data-vrm")), 1); renderVariants(); return; }
});

document.addEventListener("submit", async function (e) {
  if (e.target.id !== "sform") return;
  e.preventDefault();
  var err = $("serr");
  err.classList.add("hide");
  try {
    await api("PUT", "/api/store", {
      name: $("sname").value,
      slug: $("sslug").value,
      bio: $("sbio").value,
      whatsapp: $("swa").value,
      bankName: $("sbank").value,
      accountName: $("saname").value,
      accountNumber: $("sanum").value
    });
    await load();
    toast("Saved");
  } catch (x) { err.textContent = x.message; err.classList.remove("hide"); }
});

$("logout").addEventListener("click", async function () {
  try { await api("POST", "/api/logout", {}); } catch (e) {}
  location.href = "/";
});

load().catch(function (x) {
  $("app").innerHTML = '<p style="color:var(--danger)">' + esc(x.message) + "</p>";
});
</script>
</body>
</html>
