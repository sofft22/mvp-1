<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<title>Dashboard · BioStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5;
  --bg-2:#F1EBE1;
  --ink:#0A0A0A;
  --muted:#6B6660;
  --faint:#9A948C;
  --line:#E6DFD4;
  --accent:#C66B4F;
  --accent-soft:#F5E4DB;
  --danger:#B14A2E;
  --green:#1F6B37;
  --wa:#25D366;
  --cta:#0A0A0A;
  --cta-ink:#FBF9F5;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button{font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden],.hide{display:none!important}

.wrap{max-width:640px;margin:0 auto;padding:0 22px}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar .wrap{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;height:64px;
}
.logo{
  font-size:15px;font-weight:900;letter-spacing:.18em;
  text-transform:uppercase;flex-shrink:0;
}
.top-actions{display:flex;align-items:center;gap:2px}
.icon-btn{
  background:none;border:0;cursor:pointer;
  width:38px;height:38px;
  display:grid;place-items:center;
  color:var(--muted);
  border-radius:10px;
  transition:color .15s,background .15s;
}
.icon-btn:hover{color:var(--ink);background:var(--bg-2)}
.icon-btn svg{width:18px;height:18px;stroke-width:1.9}

/* ---------- Desktop nav ---------- */
.dnav{display:none;border-bottom:1px solid var(--line)}
.dnav .wrap{display:flex;gap:4px}
.dnav-tab{
  background:none;border:0;cursor:pointer;
  font:600 14px var(--sans);
  color:var(--muted);
  padding:16px 18px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.dnav-tab:hover{color:var(--ink)}
.dnav-tab[aria-current="page"]{
  color:var(--ink);
  border-bottom-color:var(--ink);
  font-weight:800;
}

/* ---------- Page ---------- */
main{padding:36px 0 calc(128px + env(safe-area-inset-bottom,0px))}

/* Greeting — heavy weight hierarchy */
.greeting{margin-bottom:48px}
.greeting .hello{
  font-size:13px;font-weight:500;
  color:var(--faint);
  margin:0 0 10px;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.greeting h1{
  font-size:34px;font-weight:800;
  letter-spacing:-.04em;
  line-height:1.05;
  margin:0;
}
.greeting h1 strong{
  font-weight:900;
  color:var(--accent);
}

.page-title{
  font-size:28px;font-weight:800;
  letter-spacing:-.035em;
  margin:0 0 40px;
  line-height:1.1;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:700 14px/1 var(--sans);
  background:var(--cta);color:var(--cta-ink);
  padding:15px 24px;border-radius:999px;
  border:0;cursor:pointer;
  transition:opacity .15s;
  white-space:nowrap;
  letter-spacing:-.005em;
}
.btn:hover:not(:disabled){opacity:.86}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.small{padding:11px 18px;font-size:13px}
.btn.wa{background:var(--wa);color:#053b18;font-weight:800}
.btn.block{width:100%}

/* Primary CTA block — reduced to one */
.primary-cta{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;
  padding:24px 0 32px;
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
  flex-wrap:wrap;
}
.primary-cta-copy{min-width:0;flex:1}
.primary-cta-title{
  font-size:16px;font-weight:800;
  letter-spacing:-.02em;
  margin:0 0 4px;
}
.primary-cta-sub{
  font-size:13px;color:var(--muted);
  margin:0;
}

/* ---------- Product list ---------- */
.list-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:8px;
  margin-top:24px;
}
.list-head h2{
  font-size:11px;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--faint);
  margin:0;
}
.list-head .count{
  font:600 12.5px var(--sans);
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.plist{display:grid;gap:0}
.prod{
  display:grid;
  grid-template-columns:60px 1fr auto;
  gap:18px;
  align-items:center;
  padding:22px 0;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;
  width:100%;text-align:left;
  font-family:inherit;color:inherit;
  transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.prod:hover{opacity:.7}
.prod:active{opacity:.5}
.prod .th{
  width:60px;height:60px;
  background:var(--bg-2);
  display:grid;place-items:center;
  font:900 20px var(--sans);
  overflow:hidden;
  border-radius:8px;
  color:var(--faint);
}
.prod .th img{width:100%;height:100%;object-fit:cover;display:block}
.prod .mid{min-width:0}
.prod .nm{
  font-size:15.5px;font-weight:700;
  letter-spacing:-.015em;
  line-height:1.25;
  margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.prod .cat{
  font-size:11.5px;font-weight:600;
  color:var(--faint);
  letter-spacing:.04em;
  text-transform:uppercase;
}
.prod .right{
  display:flex;flex-direction:column;
  align-items:flex-end;
  gap:6px;
  flex-shrink:0;
}
.prod .pr{
  font-size:15px;font-weight:800;
  letter-spacing:-.015em;
  color:var(--ink);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.prod .vw{
  font-size:11px;font-weight:600;
  color:var(--faint);
  white-space:nowrap;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.pill{
  display:inline-block;
  font:800 9.5px var(--sans);
  letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;
  background:var(--bg-2);color:var(--muted);
  margin-left:6px;
  vertical-align:middle;
}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.empty{
  padding:72px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

/* ---------- Store strip ---------- */
.store-strip{
  margin-top:64px;
  padding-top:36px;
  border-top:1px solid var(--line);
}
.store-strip-label{
  font-size:10px;font-weight:800;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint);
  margin-bottom:12px;
}
.store-strip-url{
  font:600 13.5px ui-monospace,"SF Mono",Menlo,monospace;
  color:var(--ink);
  word-break:break-all;
  display:block;
  margin-bottom:20px;
  letter-spacing:-.01em;
}
.store-strip-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.form-section{margin-bottom:56px}
.form-section:last-of-type{margin-bottom:0}
.section-title{
  font-size:10.5px;font-weight:900;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink);
  margin:0 0 24px;
  display:flex;align-items:center;gap:12px;
}
.section-title::after{
  content:"";flex:1;height:1px;background:var(--line);
}

.field{
  padding:22px 0;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.field:first-of-type{border-top:1px solid var(--line)}
.field-label{
  font-size:13px;font-weight:700;
  color:var(--ink);
  letter-spacing:-.005em;
}
.field-hint{
  font-size:11.5px;
  color:var(--faint);
  margin-top:5px;
  font-weight:500;
  line-height:1.4;
}
.field input[type="text"],
.field input[type="tel"],
.field input[type="email"],
.field input[type="number"],
.field textarea,
.field select{
  width:100%;
  font:500 15px var(--sans);
  padding:14px 16px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  border-radius:12px;
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
  appearance:none;
}
.field textarea{min-height:92px;resize:vertical;line-height:1.5}
.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:var(--cta);
  box-shadow:0 0 0 3px rgba(10,10,10,.07);
}
.field input::placeholder,
.field textarea::placeholder{color:var(--faint)}

.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:22px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.toggle-name{font-size:14px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em}
.toggle-desc{font-size:12.5px;color:var(--muted);margin:0}
.switch{
  position:relative;width:46px;height:28px;
  background:rgba(10,10,10,.14);
  border:0;padding:0;cursor:pointer;
  border-radius:999px;flex-shrink:0;
  transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:22px;height:22px;background:#fff;
  border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .2s;
}
.switch[aria-checked="true"]{background:var(--cta)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.imgs-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:18px;
}
.imgs-count{
  font:700 11.5px var(--sans);
  color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;
}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.img-cell{
  position:relative;aspect-ratio:1;
  background:var(--bg-2);overflow:hidden;
  border-radius:10px;
}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block}
.img-cell .x{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;
  background:var(--bg);border:0;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;
  color:var(--ink);
}
.img-cell .x svg{width:14px;height:14px}
.img-cell .main-tag{
  position:absolute;bottom:6px;left:6px;
  font:800 9px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  background:var(--cta);color:var(--bg);
  padding:3px 7px;border-radius:4px;
}
.img-add{
  aspect-ratio:1;
  border:1.5px dashed var(--line);
  display:grid;place-items:center;gap:8px;
  cursor:pointer;
  font:800 10px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);
  text-align:center;padding:8px;
  border-radius:10px;
  transition:color .2s,border-color .2s;
}
.img-add:hover{color:var(--accent);border-color:var(--accent)}
.img-add svg{width:18px;height:18px;display:block;margin:0 auto}
.img-add input{display:none}

.vhead{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:18px;
}
.vadd{
  background:none;border:0;cursor:pointer;
  font:800 11px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
  padding:4px;
}
.vadd svg{width:13px;height:13px}
.vempty{
  padding:36px 20px;text-align:center;
  border:1.5px dashed var(--line);
  font-size:13px;color:var(--muted);
  border-radius:10px;
}
.vitem{padding:22px 0;border-top:1px solid var(--line)}
.vitem:last-child{border-bottom:1px solid var(--line)}
.vgrid{display:grid;grid-template-columns:1fr;gap:16px}
.vlabel{
  font:800 10.5px var(--sans);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:8px;
}
.vitem input{
  width:100%;
  font:500 14px var(--sans);
  padding:12px 14px;
  border:1.5px solid var(--line);
  background:var(--bg);
  border-radius:10px;outline:none;
}
.vremove{
  margin-top:16px;
  background:none;border:0;cursor:pointer;
  font:800 11px var(--sans);
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--danger);padding:0;
}

.form-actions{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  margin-top:64px;padding-top:40px;
  border-top:1px solid var(--line);
}
.del-btn{
  background:none;border:0;cursor:pointer;
  font:700 13px var(--sans);
  color:var(--danger);padding:14px 0;
  margin-right:auto;
}
.err{
  font-size:13.5px;font-weight:600;
  color:var(--danger);margin-top:24px;
}

.back{
  display:inline-flex;align-items:center;gap:8px;
  background:none;border:0;cursor:pointer;
  font:700 12px var(--sans);
  color:var(--muted);padding:0;
  margin-bottom:36px;
  letter-spacing:.14em;text-transform:uppercase;
}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}

/* ---------- Categories ---------- */
.cat-list{margin-bottom:20px}
.cat-item{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px 0;
  border-bottom:1px solid var(--line);
}
.cat-item:first-child{border-top:1px solid var(--line)}
.cat-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cat-actions{display:flex;gap:18px;flex-shrink:0}
.cat-actions button{
  background:none;border:0;cursor:pointer;
  font:700 11.5px var(--sans);
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:0;
}
.cat-actions button:hover{color:var(--ink)}
.cat-actions button.danger:hover{color:var(--danger)}
.cat-add-row{display:flex;gap:10px;align-items:stretch;margin-top:12px}
.cat-add-row input{
  flex:1;
  font:500 14px var(--sans);
  padding:13px 16px;
  border:1.5px solid var(--line);
  background:var(--bg);
  border-radius:12px;
  outline:none;
}

/* ---------- Account row ---------- */
.account-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:22px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.account-email{
  font-size:13.5px;font-weight:600;
  color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.btn-logout{
  background:none;border:0;cursor:pointer;
  font:800 12px var(--sans);
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--danger);padding:8px 4px;
}

/* ---------- Plan ---------- */
.plan-current{padding-bottom:40px;border-bottom:1px solid var(--line);margin-bottom:48px}
.plan-label{
  font-size:10px;font-weight:800;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint);margin-bottom:12px;
}
.plan-name{
  font-size:34px;font-weight:800;letter-spacing:-.04em;
  line-height:1;margin:0;
}
.plan-meta{font-size:13px;color:var(--muted);margin-top:12px}

.plan-row{padding:28px 0;border-bottom:1px solid var(--line)}
.plan-row:last-of-type{border-bottom:0}
.plan-row h3{
  font-size:16px;font-weight:800;letter-spacing:-.02em;
  margin:0 0 8px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.plan-row .price{font-size:14px;font-weight:700;margin-bottom:12px}
.plan-row .price small{font-weight:500;color:var(--muted);font-size:12.5px}
.plan-row ul{
  list-style:none;padding:0;margin:0;
  color:var(--muted);font-size:13.5px;
  display:grid;gap:5px;
}
.plan-row.current{
  background:var(--accent-soft);
  margin:0 -22px;padding:28px 22px;
}
.bankbox{
  background:var(--bg-2);padding:20px 22px;
  margin-bottom:20px;font-size:13.5px;border-radius:12px;
}
.bankbox div{
  display:flex;justify-content:space-between;gap:12px;
  padding:6px 0;
}
.bankbox span{color:var(--muted)}
.bankbox b{font-weight:800}

/* ---------- Bottom nav ---------- */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bg);border-top:1px solid var(--line);
  padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(3,1fr);
}
.bnav-item{
  background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px;
  color:var(--muted);
  font:700 10px var(--sans);
  letter-spacing:.06em;
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.bnav-item svg{
  width:22px;height:22px;
  stroke-width:1.75;fill:none;stroke:currentColor;
}
.bnav-item[aria-current="page"]{color:var(--ink)}
.bnav-item[aria-current="page"] svg{stroke-width:2.4}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,140%);
  background:var(--cta);color:var(--cta-ink);
  font:700 13px var(--sans);
  letter-spacing:-.005em;
  padding:14px 22px;border-radius:999px;
  box-shadow:0 10px 30px -10px rgba(10,10,10,.5);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  z-index:100;max-width:calc(100% - 40px);text-align:center;
}
#toast.show{transform:translate(-50%,0)}

/* ---------- Desktop ---------- */
@media (min-width:720px){
  .wrap{padding:0 36px}
  .dnav{display:block}
  main{padding:64px 0 100px}
  .topbar .wrap{height:72px}
  .logo{font-size:16px}
  .bnav{display:none}
  #toast{bottom:40px}
  .greeting{margin-bottom:64px}
  .greeting h1{font-size:42px}
  .page-title{font-size:32px;margin-bottom:48px}
  .field{
    grid-template-columns:220px 1fr;
    gap:36px;align-items:center;
    padding:26px 0;
  }
  .field.stack{align-items:flex-start}
  .field.stack .field-label-wrap{padding-top:14px}
  .imgs{grid-template-columns:repeat(3,130px)}
  .vgrid{grid-template-columns:1fr 180px}
  .prod{grid-template-columns:72px 1fr auto;gap:26px;padding:26px 0}
  .prod .th{width:72px;height:72px}
  .form-section{margin-bottom:64px}
  .primary-cta{padding:32px 0 40px}
}
</style>
<script src="/config.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#/products">BioStore</a>
    <div class="top-actions">
      <button class="icon-btn" id="copyLink" type="button" aria-label="Copy store link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <a class="icon-btn" id="viewStore" href="#" target="_blank" rel="noopener" aria-label="View store">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
      </a>
    </div>
  </div>
  <nav class="dnav">
    <div class="wrap">
      <button class="dnav-tab" data-route="products" type="button">Products</button>
      <button class="dnav-tab" data-route="settings" type="button">Settings</button>
      <button class="dnav-tab" data-route="plan" type="button">Plan</button>
    </div>
  </nav>
</header>

<main>
  <div class="wrap" id="app">
    <p style="color:var(--muted)">Loading…</p>
  </div>
</main>

<nav class="bnav" id="bnav">
  <button class="bnav-item" data-route="products" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
    <span>Products</span>
  </button>
  <button class="bnav-item" data-route="settings" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
  <button class="bnav-item" data-route="plan" type="button">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
    <span>Plan</span>
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
var S = { me: null, route: "products", editing: null, categories: [] };
var P = { id: null, images: [], variants: [], inStock: true };
var $ = function (id) { return document.getElementById(id); };
var CFG = window.BIOSHOP_CONFIG || {};

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function naira(n) { return "₦" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2400); }
function dateStr(ms) { return new Date(ms).toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" }); }

async function api(method, url, body, rawType) {
  var opt = { method: method, headers: {}, credentials: "same-origin" };
  if (body !== undefined) {
    if (rawType) { opt.headers["content-type"] = rawType; opt.body = body; }
    else { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
  }
  var r = await fetch(url, opt), d = null;
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = "/login"; throw new Error("Please log in again."); }
  if (!r.ok) throw new Error((d && d.error) || "Something went wrong.");
  return d;
}

function storeUrl() { return location.origin + "/store/" + S.me.store.slug; }

function parseRoute() {
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  if (parts[0] === "product") return { name: "product", id: parts[1] || null };
  if (parts[0] === "settings") return { name: "settings" };
  if (parts[0] === "plan") return { name: "plan" };
  return { name: "products" };
}
function navigate(path) { location.hash = path; }

window.addEventListener("hashchange", function () {
  var r = parseRoute();
  if (r.name === "product") openForm(r.id);
  else { S.route = r.name; S.editing = null; render(); }
  updateNavActive();
});

function updateNavActive() {
  var route = S.editing ? "products" : S.route;
  document.querySelectorAll("[data-route]").forEach(function (b) {
    if (b.getAttribute("data-route") === route) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-route]");
  if (!b) return;
  navigate("/" + b.getAttribute("data-route"));
});

async function load() {
  S.me = await api("GET", "/api/me");
  var st = S.me.store;
  $("viewStore").href = "/store/" + st.slug;
  try {
    var cd = await api("GET", "/api/categories");
    S.categories = cd.categories || [];
  } catch (e) { S.categories = []; }
  var r = parseRoute();
  if (r.name === "product") openForm(r.id);
  else { S.route = r.name; S.editing = null; render(); }
  updateNavActive();
}

function render() {
  var html = "";
  if (S.editing !== null) html = formView();
  else if (S.route === "products") html = productsView();
  else if (S.route === "settings") html = settingsView();
  else if (S.route === "plan") html = planView();
  $("app").innerHTML = html;
  if (S.editing !== null) wireForm();
  if (S.route === "settings") wireSettings();
}

/* ============ Products ============ */
function productsView() {
  var m = S.me, lim = m.limits, atLimit = m.products.length >= lim.products;
  var st = m.store;
  var named = st.name && st.name !== "My store";
  var who = named ? st.name : "there";

  var h = '<div class="greeting">' +
    '<p class="hello">Welcome back</p>' +
    '<h1>Hey, <strong>' + esc(who) + '</strong>.</h1>' +
  '</div>';

  // Primary CTA — the one big action
  h += '<div class="primary-cta">' +
    '<div class="primary-cta-copy">' +
      '<p class="primary-cta-title">' + (m.products.length ? "Add another product" : "Add your first product") + '</p>' +
      '<p class="primary-cta-sub">Photo, name, price. That\'s it.</p>' +
    '</div>' +
    '<button class="btn" data-act="add"' + (atLimit ? " disabled" : "") + ' type="button">+ Add product</button>' +
  '</div>';

  if (atLimit) {
    h += '<p style="margin:12px 0 0;font-size:13px;color:var(--muted)">Your ' + esc(lim.planName) + ' plan is full. ' +
      '<button data-route="plan" style="background:none;border:0;cursor:pointer;color:var(--accent);font-weight:800;padding:0;font-family:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px" type="button">Upgrade</button></p>';
  }

  // Product list
  h += '<div class="list-head">' +
    '<h2>Products</h2>' +
    '<div class="count">' + m.products.length + (lim.products >= 100000 ? "" : " of " + lim.products) + '</div>' +
  '</div>';

  if (!m.products.length) {
    h += '<div class="empty">No products yet.</div>';
  } else {
    h += '<div class="plist">';
    m.products.forEach(function (p) {
      var th = (p.images && p.images.length)
        ? '<img src="' + esc(p.images[0].url) + '" alt="">'
        : esc((p.name || "?").charAt(0).toUpperCase());
      var cat = p.category || "";
      var views = p.views || 0;
      h += '<button class="prod" data-act="edit" data-id="' + esc(p.id) + '" type="button">' +
        '<div class="th">' + th + '</div>' +
        '<div class="mid">' +
          '<div class="nm">' + esc(p.name) +
            (p.hidden ? ' <span class="pill accent">Hidden</span>' : "") +
            (p.inStock === false ? ' <span class="pill">Sold out</span>' : "") +
          '</div>' +
          (cat ? '<div class="cat">' + esc(cat) + '</div>' : '') +
        '</div>' +
        '<div class="right">' +
          '<span class="pr">' + naira(p.price) + '</span>' +
          '<span class="vw">' + views + ' view' + (views === 1 ? "" : "s") + '</span>' +
        '</div>' +
      '</button>';
    });
    h += '</div>';
  }

  h += '<div class="store-strip">' +
    '<div class="store-strip-label">Your store link</div>' +
    '<span class="store-strip-url">' + esc(location.host + "/store/" + st.slug) + '</span>' +
    '<div class="store-strip-actions">' +
      '<button class="btn ghost small" data-act="copylink" type="button">Copy link</button>' +
      '<a class="btn small" href="/store/' + esc(st.slug) + '" target="_blank" rel="noopener">View store</a>' +
    '</div>' +
  '</div>';

  return h;
}

/* ============ Product form ============ */
function formView() {
  var isNew = !P.id;
  var h = '';
  h += '<button class="back" data-act="close-form" type="button">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>' +
    'Products' +
  '</button>';
  h += '<h1 class="page-title">' + (isNew ? "New product" : "Edit product") + '</h1>';
  h += '<form id="pform" novalidate>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Basics</h3>' +
    field("Name", '<input type="text" id="pname" maxlength="80" placeholder="Ankara tote bag" value="' + esc(P.name || "") + '">') +
    field("Description", '<textarea id="pdesc" maxlength="500" placeholder="Short description…">' + esc(P.description || "") + '</textarea>', null, true) +
    field("Price (₦)", '<input type="number" id="pprice" inputmode="numeric" placeholder="15000" value="' + esc(P.price || "") + '">') +
    field("Compare at (₦)", '<input type="number" id="pcompare" inputmode="numeric" placeholder="20000" value="' + esc(P.compare || "") + '">', "Optional") +
  '</div>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Category</h3>' +
    field("Category", '<select id="pcat">' + catOptions() + '</select>') +
    field("Badge", '<select id="pbadge">' +
      ["", "Bestseller", "New", "Limited"].map(function (b) {
        return '<option value="' + esc(b) + '"' + (P.badge === b ? ' selected' : '') + '>' + (b || "None") + '</option>';
      }).join('') +
    '</select>', "Optional") +
  '</div>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Stock</h3>' +
    '<div class="toggle-row">' +
      '<div><p class="toggle-name">In stock</p><p class="toggle-desc" id="stockDesc">' + (P.inStock ? "Available for purchase" : "Hidden from sale") + '</p></div>' +
      '<button type="button" class="switch" id="pstock" role="switch" aria-checked="' + (P.inStock ? "true" : "false") + '" aria-label="Toggle stock"></button>' +
    '</div>' +
  '</div>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Images</h3>' +
    '<div class="imgs-head"><span class="imgs-count" id="imgCount">' + P.images.length + ' / ' + S.me.limits.images + '</span></div>' +
    '<div class="imgs" id="images"></div>' +
  '</div>';

  h += '<div class="form-section">' +
    '<div class="vhead">' +
      '<h3 class="section-title" style="margin:0">Variants</h3>' +
      '<button type="button" class="vadd" id="vadd">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
        'Add' +
      '</button>' +
    '</div>' +
    '<div id="variants"></div>' +
  '</div>';

  h += '<div class="err hide" id="perr" role="alert"></div>';

  h += '<div class="form-actions">';
  if (!isNew) h += '<button type="button" class="del-btn" id="pdel">Delete product</button>';
  h += '<button type="submit" class="btn" id="psave">' + (isNew ? "Create product" : "Save changes") + '</button>';
  h += '</div>';
  h += '</form>';
  return h;
}

function field(label, input, hint, stack) {
  return '<label class="field' + (stack ? ' stack' : '') + '">' +
    '<span class="field-label-wrap"><span class="field-label">' + esc(label) + '</span>' + (hint ? '<div class="field-hint">' + esc(hint) + '</div>' : '') + '</span>' +
    '<span>' + input + '</span>' +
  '</label>';
}

function catOptions() {
  var cats = S.categories && S.categories.length ? S.categories : (CFG.categories || []);
  if (!cats.length) return '<option value="">No categories yet</option>';
  var h = '<option value="">None</option>';
  cats.forEach(function (c) {
    var label = c.name || c.label;
    h += '<option value="' + esc(label) + '"' + (P.category === label ? ' selected' : '') + '>' + esc(label) + '</option>';
  });
  return h;
}

function openForm(id) {
  if (id) {
    var p = S.me.products.find(function (x) { return x.id === id; });
    if (!p) { navigate("/products"); return; }
    P = {
      id: p.id,
      name: p.name || "",
      description: p.description || "",
      price: p.price || "",
      compare: p.compareAtPrice || p.compare_at_price || "",
      category: p.category || "",
      badge: p.badge || "",
      inStock: !(p.inStock === false || p.in_stock === false),
      images: (p.images || []).map(function (i) { return i.url || i; }),
      variants: (p.variants && p.variants.suggested) || []
    };
  } else {
    P = { id: null, images: [], variants: [], inStock: true, name: "", description: "", price: "", compare: "", category: "", badge: "" };
  }
  S.editing = id || "new";
  render();
  updateNavActive();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function wireForm() {
  var bind = function (id, key) {
    var el = $(id);
    if (el) el.addEventListener("input", function () { P[key] = el.value; });
  };
  bind("pname", "name");
  bind("pdesc", "description");
  bind("pprice", "price");
  bind("pcompare", "compare");
  var cat = $("pcat"); if (cat) cat.addEventListener("change", function () { P.category = cat.value; });
  var badge = $("pbadge"); if (badge) badge.addEventListener("change", function () { P.badge = badge.value; });
  var stock = $("pstock");
  if (stock) stock.addEventListener("click", function () {
    P.inStock = !P.inStock;
    stock.setAttribute("aria-checked", P.inStock ? "true" : "false");
    var d = $("stockDesc"); if (d) d.textContent = P.inStock ? "Available for purchase" : "Hidden from sale";
  });
  renderImages();
  renderVariants();
  var vadd = $("vadd");
  if (vadd) vadd.addEventListener("click", function () { P.variants.push({ label: "", priceDelta: 0 }); renderVariants(); });
  var del = $("pdel");
  if (del) del.addEventListener("click", async function () {
    if (!confirm("Delete this product? This can't be undone.")) return;
    try { await api("DELETE", "/api/products/" + P.id); navigate("/products"); await load(); toast("Deleted"); }
    catch (x) { alert(x.message); }
  });
  var form = $("pform");
  if (form) form.addEventListener("submit", saveProduct);
  var imgs = $("images");
  if (imgs) imgs.addEventListener("click", function (e) {
    var rm = e.target.closest("[data-rm]");
    if (rm) { P.images.splice(Number(rm.getAttribute("data-rm")), 1); renderImages(); }
  });
  var vars = $("variants");
  if (vars) {
    vars.addEventListener("click", function (e) {
      var vrm = e.target.closest("[data-vrm]");
      if (vrm) { P.variants.splice(Number(vrm.getAttribute("data-vrm")), 1); renderVariants(); }
    });
    vars.addEventListener("input", function (e) {
      var vi = e.target.getAttribute("data-vi");
      if (vi == null) return;
      var i = Number(vi), k = e.target.getAttribute("data-vk");
      P.variants[i][k] = (k === "priceDelta") ? Number(e.target.value) : e.target.value;
    });
  }
}

function renderImages() {
  var lim = S.me.limits.images;
  var h = "";
  P.images.forEach(function (url, i) {
    h += '<div class="img-cell">' +
      '<img src="' + esc(url) + '" alt="">' +
      '<button type="button" class="x" data-rm="' + i + '" aria-label="Remove">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
      (i === 0 ? '<span class="main-tag">Main</span>' : "") +
    '</div>';
  });
  if (P.images.length < lim) {
    h += '<label class="img-add">' +
      '<input type="file" accept="image/*" id="imgInput">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
      '<span>Add</span>' +
    '</label>';
  }
  $("images").innerHTML = h;
  $("imgCount").textContent = P.images.length + " / " + lim;
  var inp = $("imgInput");
  if (inp) inp.addEventListener("change", onImg);
}

async function onImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  var lbl = e.target.closest(".img-add");
  if (lbl) { lbl.style.pointerEvents = "none"; lbl.style.opacity = ".5"; }
  try {
    var blob = await compress(file);
    var r = await fetch("/api/upload", {
      method: "POST",
      headers: { "content-type": "image/jpeg" },
      body: blob,
      credentials: "same-origin"
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || "Upload failed");
    P.images.push(d.url);
    renderImages();
  } catch (x) { alert(x.message); }
  if (lbl) { lbl.style.pointerEvents = ""; lbl.style.opacity = ""; }
}

async function compress(file) {
  var bmp = await createImageBitmap(file);
  var scale = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  var c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.85); });
}

function renderVariants() {
  if (!P.variants.length) {
    $("variants").innerHTML = '<div class="vempty">Single price — no variants.</div>';
    return;
  }
  $("variants").innerHTML = P.variants.map(function (v, i) {
    return '<div class="vitem">' +
      '<div class="vgrid">' +
        '<div><label class="vlabel">Label</label><input type="text" data-vi="' + i + '" data-vk="label" value="' + esc(v.label || "") + '" placeholder="Size M"></div>' +
        '<div><label class="vlabel">+ Price (₦)</label><input type="number" data-vi="' + i + '" data-vk="priceDelta" value="' + esc(v.priceDelta || 0) + '" placeholder="0"></div>' +
      '</div>' +
      '<button type="button" class="vremove" data-vrm="' + i + '">Remove</button>' +
    '</div>';
  }).join("");
}

async function saveProduct(e) {
  e.preventDefault();
  var err = $("perr"), btn = $("psave");
  err.classList.add("hide");
  var name = (P.name || "").trim();
  var price = Number(P.price);
  if (name.length < 2) return showFormErr("Enter the product name.");
  if (!price || price < 1) return showFormErr("Enter a valid price.");
  if (!P.images.length) return showFormErr("Add at least one image.");

  btn.disabled = true;
  var old = btn.textContent;
  btn.textContent = "Saving…";
  try {
    var body = {
      name: name,
      price: price,
      description: P.description || "",
      compareAtPrice: P.compare ? Number(P.compare) : null,
      category: P.category || null,
      badge: P.badge || null,
      inStock: P.inStock,
      images: P.images,
      variants: P.variants.length ? { suggested: P.variants } : null
    };
    if (P.id) await api("PUT", "/api/products/" + P.id, body);
    else await api("POST", "/api/products", body);
    navigate("/products");
    await load();
    toast(P.id ? "Saved" : "Created");
  } catch (x) {
    showFormErr(x.message);
    btn.disabled = false;
    btn.textContent = old;
  }
}

function showFormErr(msg) {
  var err = $("perr");
  err.textContent = msg;
  err.classList.remove("hide");
  err.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ============ Settings ============ */
function settingsView() {
  var st = S.me.store;
  var u = S.me.user || {};
  var h = '<h1 class="page-title">Settings</h1>';
  h += '<form id="sform" novalidate>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Store</h3>' +
    field("Name", '<input type="text" id="sname" maxlength="60" value="' + esc(st.name === "My store" ? "" : st.name) + '" placeholder="Adaeze\'s Closet">') +
    field("Link", '<input type="text" id="sslug" maxlength="30" value="' + esc(st.slug) + '" autocapitalize="none" autocomplete="off">', location.host + "/store/") +
    field("Bio", '<textarea id="sbio" maxlength="200" placeholder="What do you sell?">' + esc(st.bio || "") + '</textarea>', null, true) +
  '</div>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Contact</h3>' +
    field("WhatsApp", '<input type="tel" id="swa" inputmode="tel" value="' + esc(st.whatsapp || "") + '" placeholder="08012345678">', "Orders open a chat with this number.") +
  '</div>';

  h += '<div class="form-section">' +
    '<h3 class="section-title">Payment</h3>' +
    field("Bank", '<input type="text" id="sbank" maxlength="60" value="' + esc(st.bankName || "") + '" placeholder="GTBank">') +
    field("Account name", '<input type="text" id="saname" maxlength="80" value="' + esc(st.accountName || "") + '" placeholder="Adaeze Okafor">') +
    field("Account number", '<input type="text" id="sanum" inputmode="numeric" maxlength="10" value="' + esc(st.accountNumber || "") + '" placeholder="0123456789">') +
  '</div>';

  h += '<div class="err hide" id="serr"></div>';
  h += '<div class="form-actions"><button type="submit" class="btn" id="ssave">Save</button></div>';
  h += '</form>';

  h += '<div class="form-section" style="margin-top:72px">' +
    '<h3 class="section-title">Categories</h3>' +
    '<div class="cat-list" id="catList"></div>' +
    '<div class="cat-add-row">' +
      '<input type="text" id="newCat" placeholder="Add a category" maxlength="40">' +
      '<button class="btn small" type="button" id="addCat">Add</button>' +
    '</div>' +
  '</div>';

  h += '<div class="form-section" style="margin-top:72px">' +
    '<h3 class="section-title">Account</h3>' +
    '<div class="account-row">' +
      '<span class="account-email">' + esc(u.email || st.email || "") + '</span>' +
      '<button type="button" class="btn-logout" id="logoutBtn">Log out</button>' +
    '</div>' +
  '</div>';

  return h;
}

function wireSettings() {
  var inp = $("sslug");
  if (inp) inp.addEventListener("input", function () {
    inp.value = inp.value.toLowerCase().replace(/[^a-z0-9-]/g, "");
  });
  var form = $("sform");
  if (form) form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = $("serr"), btn = $("ssave");
    err.classList.add("hide");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      await api("PUT", "/api/store", {
        name: $("sname").value,
        slug: $("sslug").value,
        bio: $("sbio").value,
        whatsapp: $("swa").value,
        bankName: $("sbank").value,
        accountName: $("saname").value,
        accountNumber: $("sanum").value
      });
      await load();
      toast("Saved");
    } catch (x) {
      err.textContent = x.message;
      err.classList.remove("hide");
    }
    btn.disabled = false; btn.textContent = "Save";
  });

  var logout = $("logoutBtn");
  if (logout) logout.addEventListener("click", async function () {
    if (!confirm("Log out?")) return;
    try { await api("POST", "/api/logout", {}); } catch (e) {}
    location.href = "/";
  });

  renderCategories();
  var add = $("addCat");
  var inp2 = $("newCat");
  if (add && inp2) {
    add.addEventListener("click", addCategory);
    inp2.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addCategory(); } });
  }
}

function renderCategories() {
  var list = $("catList");
  if (!list) return;
  if (!S.categories.length) {
    list.innerHTML = '<p style="color:var(--faint);font-size:13px;margin:0">No categories yet.</p>';
    return;
  }
  list.innerHTML = S.categories.map(function (c) {
    return '<div class="cat-item">' +
      '<span class="cat-name">' + esc(c.name) + '</span>' +
      '<div class="cat-actions">' +
        '<button type="button" data-cat-rename="' + esc(c.id) + '">Rename</button>' +
        '<button type="button" class="danger" data-cat-del="' + esc(c.id) + '">Delete</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

async function addCategory() {
  var inp = $("newCat");
  var name = (inp.value || "").trim();
  if (name.length < 2) return;
  inp.disabled = true;
  try {
    await api("POST", "/api/categories", { name: name });
    inp.value = "";
    var cd = await api("GET", "/api/categories");
    S.categories = cd.categories || [];
    renderCategories();
    toast("Added");
  } catch (x) { alert(x.message); }
  inp.disabled = false;
  inp.focus();
}

document.addEventListener("click", async function (e) {
  var rn = e.target.closest("[data-cat-rename]");
  if (rn) {
    var id = rn.getAttribute("data-cat-rename");
    var c = S.categories.find(function (x) { return x.id === id; });
    if (!c) return;
    var name = prompt("Rename category", c.name);
    if (!name || name === c.name) return;
    try {
      await api("PUT", "/api/categories/" + id, { name: name });
      var cd = await api("GET", "/api/categories");
      S.categories = cd.categories || [];
      renderCategories();
      toast("Renamed");
    } catch (x) { alert(x.message); }
    return;
  }
  var dl = e.target.closest("[data-cat-del]");
  if (dl) {
    var id2 = dl.getAttribute("data-cat-del");
    if (!confirm("Delete this category?")) return;
    try {
      await api("DELETE", "/api/categories/" + id2);
      var cd2 = await api("GET", "/api/categories");
      S.categories = cd2.categories || [];
      renderCategories();
      toast("Deleted");
    } catch (x) { alert(x.message); }
  }
});

/* ============ Plan ============ */
function planView() {
  var m = S.me, u = m.user, plans = m.plans, now = Date.now();
  var h = '<h1 class="page-title">Plan</h1>';

  h += '<div class="plan-current">' +
    '<div class="plan-label">Current plan</div>' +
    '<div class="plan-name">' + esc(m.limits.planName) + '</div>';
  if (u.plan !== "free" && u.planExpiresAt) {
    h += u.planExpiresAt > now
      ? '<p class="plan-meta">Active until ' + dateStr(u.planExpiresAt) + '.</p>'
      : '<p class="plan-meta">Ended ' + dateStr(u.planExpiresAt) + '.</p>';
  }
  h += '</div>';

  ["free", "starter", "pro"].forEach(function (k) {
    var p = plans[k];
    var isCurrent = m.limits.planName === p.name;
    h += '<div class="plan-row' + (isCurrent ? " current" : "") + '">' +
      '<h3>' + p.name + (isCurrent ? ' <span class="pill accent">Current</span>' : "") + '</h3>' +
      '<div class="price">' + (p.price ? naira(p.price) + ' <small>per month</small>' : '<small>Free</small>') + '</div>' +
      '<ul>' +
        '<li>' + limitText(p.products) + ' products</li>' +
        '<li>' + p.images + ' image' + (p.images > 1 ? "s" : "") + '</li>' +
      '</ul>' +
    '</div>';
  });

  h += '<div style="margin-top:64px">' +
    '<h3 class="section-title">Upgrade</h3>' +
    '<p style="font-size:13.5px;color:var(--muted);margin:0 0 24px">' +
    (CFG.accountNumber ? "Send payment to the account below, then message us." : "Message BioStore to upgrade.") +
    '</p>';

  if (CFG.accountNumber) {
    h += '<div class="bankbox">' +
      bankRow("Bank", CFG.bankName) +
      bankRow("Account name", CFG.accountName) +
      bankRow("Account number", CFG.accountNumber) +
    '</div>';
  }
  if (CFG.whatsapp) {
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    ["starter", "pro"].forEach(function (k) {
      var text = "Hi BioStore, I'd like the " + plans[k].name + " plan. My email is " + u.email + ".";
      h += '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(CFG.whatsapp) + "?text=" + encodeURIComponent(text) + '">' + plans[k].name + '</a>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function limitText(n) { return n >= 100000 ? "Unlimited" : String(n); }
function bankRow(k, v) { return v ? "<div><span>" + esc(k) + "</span><b>" + esc(v) + "</b></div>" : ""; }

/* ============ Actions ============ */
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act='copylink']");
  if (b) copy(storeUrl());
  var add = e.target.closest("[data-act='add']");
  if (add) navigate("/product");
  var edit = e.target.closest("[data-act='edit']");
  if (edit) navigate("/product/" + edit.getAttribute("data-id"));
  var close = e.target.closest("[data-act='close-form']");
  if (close) navigate("/products");
});

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, fb);
  } else fb();
  function fb() {
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); toast("Copied"); } catch (e) {}
    document.body.removeChild(t);
  }
}

$("copyLink").addEventListener("click", function () { if (S.me) copy(storeUrl()); });

load().catch(function (x) {
  $("app").innerHTML = '<p style="color:var(--danger)">' + esc(x.message) + "</p>";
});
</script>
</body>
</html>
