<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open your free store · BIOSHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="auth">
  <a class="logo" href="/">BIOSHOP</a>
  <h1 style="margin-top:36px">Open your free store</h1>
  <p class="muted">Just a few details. You can add your first product in a minute.</p>
  <form id="f" novalidate>
    <label class="field"><span>Store name</span><input type="text" name="storeName" maxlength="60" required autocomplete="organization"><small>This is what customers will see, like "Adaeze's Closet".</small></label>
    <label class="field"><span>WhatsApp number</span><input type="tel" name="whatsapp" inputmode="tel" required autocomplete="tel" placeholder="08012345678"><small>Orders will open a chat with this number.</small></label>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" inputmode="email" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit">Create my store</button>
  </form>
  <p class="alt">Already have a store? <a href="/login">Log in</a></p>
</div>
<script>
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = e.target, err = document.getElementById("err"), btn = document.getElementById("go");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Creating your store…";
  try {
    var r = await fetch("/api/signup", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        storeName: f.storeName.value,
        whatsapp: f.whatsapp.value,
        email: f.email.value,
        password: f.password.value
      })
    });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(d.error || "Something went wrong. Try again.");
    location.href = "/dashboard";
  } catch (x) {
    err.textContent = x.message;
    btn.disabled = false;
    btn.textContent = "Create my store";
  }
});
</script>
</body>
</html>
